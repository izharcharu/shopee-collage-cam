<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A75"><meta name="apple-mobile-web-app-capable" content="yes">
<title>ถ่ายรูปลง Shopee 1:1</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F3;--panel:#fff;--ink:#16222B;--mute:#5d6b75;--line:#d5dce1;--acc:#0B7A75;--accInk:#fff;--hi:#FF5722;--bad:#b42318;--ph:#dfe5e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181D;--panel:#1B242B;--ink:#EAF0F3;--mute:#93a2ad;--line:#2d3a43;--acc:#2BB3AB;--accInk:#04201f;--hi:#ff7a4d;--bad:#ff8a7a;--ph:#26323a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181D;--panel:#1B242B;--ink:#EAF0F3;--mute:#93a2ad;--line:#2d3a43;--acc:#2BB3AB;--accInk:#04201f;--hi:#ff7a4d;--bad:#ff8a7a;--ph:#26323a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Noto Sans Thai",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 120px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:17px;margin:0;font-weight:700}
.sw{width:min(100%,52vh);margin:0 auto}
@supports (height:1dvh){.sw{width:min(100%,52dvh)}}
#stage{position:relative;width:100%;aspect-ratio:1/1;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.layer{position:absolute;inset:0;pointer-events:none}
#cl{z-index:0}#tl{z-index:3}
.cell,.txt{pointer-events:auto}
.cell{position:absolute}
.cell .in{position:absolute;inset:var(--g,0px);background:var(--ph);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cell .no{font-size:calc(var(--S)*.05);font-weight:700;pointer-events:none}
.cell:not(.has) .in{outline:2px dashed var(--acc);outline-offset:-6px;color:var(--acc)}
.cell .lb{position:absolute;bottom:calc(var(--S)*.02);left:50%;transform:translateX(-50%);max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(0,0,0,.65);color:#fff;font-weight:700;font-size:calc(var(--S)*.04);line-height:1;padding:calc(var(--S)*.014) calc(var(--S)*.028);border-radius:999px;pointer-events:none}
#vid{position:absolute;z-index:1;object-fit:cover;pointer-events:none;background:#000}
#vid[hidden],#ring[hidden],#hd[hidden]{display:none}
#ring{position:absolute;z-index:2;border:3px solid var(--hi);pointer-events:none}
#hd{position:absolute;z-index:4;width:36px;height:36px;background:var(--hi);border-radius:10px 0 0 0;touch-action:none}
#hd::after{content:"";position:absolute;right:8px;bottom:8px;width:12px;height:12px;border-right:3px solid #fff;border-bottom:3px solid #fff}
.txt{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-weight:700;line-height:1.15;padding:0 .1em}
.txt.bgp{background:rgba(0,0,0,.65);padding:.25em .5em;border-radius:.35em}
.txt.sel{outline:3px solid var(--hi);outline-offset:3px}
.hint{color:var(--mute);font-size:13px;margin:6px 0 0;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .b{flex:0 0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.card h2{font-size:14px;margin:0 0 8px;font-weight:700}
summary{font-weight:600;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row+.row{margin-top:10px}
.b{font:600 14px "Noto Sans Thai",sans-serif;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 12px;border-radius:10px}
.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.bad{color:var(--bad)}
.on{background:var(--ink);color:var(--bg)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);flex:1;min-width:120px}
input[type=text]{font:400 16px "Noto Sans Thai",sans-serif;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=color]{width:44px;height:38px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
input[type=range]{width:100%}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
.bar>div{max-width:528px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.bar .l{justify-self:start}.bar .r{justify-self:end}
#shutter{width:72px;height:72px;border-radius:50%;border:5px solid var(--acc);background:var(--panel);box-shadow:inset 0 0 0 5px var(--acc)}
#shutter:active{transform:scale(.94)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#modal[hidden]{display:none}
#modal img{max-width:100%;max-height:68vh;border-radius:6px}
#modal p{color:#fff;margin:0;text-align:center;font-size:14px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#16222B;color:#fff;padding:9px 14px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>ถ่ายรูปลง Shopee 1:1</h1><button class="b" id="lockBtn">ล็อกกรอบ</button></div>
  <div class="sw"><div id="stage">
    <div id="cl" class="layer"></div>
    <video id="vid" playsinline muted hidden></video>
    <div id="ring" hidden></div>
    <div id="tl" class="layer"></div>
    <div id="hd" data-k="h" hidden></div>
  </div></div>
  <p class="hint" id="status">กำลังเปิดกล้อง…</p>
  <div class="chips" id="camChips" hidden></div>
  <div class="row" id="zoomRow" hidden><label>ซูม <b id="zv"></b><input type="range" id="zoom"></label></div>
  <div class="chips" id="chips"></div>
  <div class="card" id="sel"></div>
  <details class="card"><summary>ตั้งค่าเพิ่มเติม</summary>
    <div class="row" style="margin-top:10px"><label>ระยะห่างระหว่างช่อง<input type="range" id="gap" min="0" max="6" step="0.2"></label>
    <label style="flex:0 0 auto;min-width:0">สีพื้น<input type="color" id="bg"></label></div>
    <div class="row"><button class="b" id="album">เลือกรูปจากอัลบั้ม</button><button class="b bad" id="clearAll">ล้างรูปทั้งหมด</button></div>
  </details>
</div>

<div class="bar"><div>
  <button class="b l" id="flip">สลับกล้อง</button>
  <button id="shutter" aria-label="ถ่ายรูป"></button>
  <button class="b pri r" id="exportBtn">สร้างรูป</button>
</div></div>

<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileAlb" accept="image/*" hidden>
<div id="modal" hidden>
  <img id="outImg" alt="รูปที่สร้างเสร็จ">
  <p>กดค้างที่รูปเพื่อบันทึกลงเครื่อง</p>
  <div class="row"><button class="b pri" id="shareBtn">แชร์ / บันทึก</button><button class="b" id="closeModal">ปิด</button></div>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),stage=$('#stage'),cl=$('#cl'),tl=$('#tl'),vid=$('#vid'),ring=$('#ring'),hd=$('#hd');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let uid=1;
const S={gap:1.2,bg:'#ffffff',lock:false,cells:[],texts:[],sel:null,act:null};
const PRESETS=[
 ['ใหญ่ซ้าย + 3 ขวา',[[0,0,60,100],[60,0,40,33.34],[60,33.34,40,33.33],[60,66.67,40,33.33]]],
 ['ใหญ่ซ้าย + 2 ขวา',[[0,0,60,100],[60,0,40,50],[60,50,40,50]]],
 ['ใหญ่บน + 3 ล่าง',[[0,0,100,60],[0,60,33.34,40],[33.34,60,33.33,40],[66.67,60,33.33,40]]],
 ['2×2',[[0,0,50,50],[50,0,50,50],[0,50,50,50],[50,50,50,50]]],
 ['1 ช่องเต็ม',[[0,0,100,100]]]
];
const mk=(r,old)=>({id:uid++,x:r[0],y:r[1],w:r[2],h:r[3],label:old?old.label:'',url:old?old.url:null,img:old?old.img:null});
const cellById=id=>S.cells.find(c=>c.id===id);
const find=(k,id)=>(k==='c'?S.cells:S.texts).find(o=>o.id===id);
function applyPreset(i){S.cells=PRESETS[i][1].map((r,k)=>mk(r,S.cells[k]));S.act=S.cells[0].id;S.sel={k:'c',id:S.act};build();save()}

/* ---------- stage ---------- */
const els={};
function build(){
  cl.innerHTML='';tl.innerHTML='';
  for(const k in els)delete els[k];
  S.cells.forEach(c=>{
    const d=document.createElement('div');d.className='cell';d.dataset.k='c';d.dataset.id=c.id;
    d.innerHTML='<div class="in"><span class="no"></span><img hidden alt=""><span class="lb" hidden></span></div>';
    cl.appendChild(d);els['c'+c.id]=d;
  });
  S.texts.forEach(t=>{
    const d=document.createElement('div');d.className='txt';d.dataset.k='t';d.dataset.id=t.id;
    tl.appendChild(d);els['t'+t.id]=d;
  });
  if(!cellById(S.act))S.act=null;
  placeAll();renderSel();
}
function place(o){
  const isC=o.w!==undefined,d=els[(isC?'c':'t')+o.id];if(!d)return;
  const P=stage.clientWidth;
  if(isC){
    Object.assign(d.style,{left:o.x+'%',top:o.y+'%',width:o.w+'%',height:o.h+'%'});
    d.querySelector('.no').textContent=o.img?'':(S.cells.indexOf(o)+1);
    const im=d.querySelector('img');if(o.url){if(im.getAttribute('src')!==o.url)im.src=o.url;im.hidden=false}else{im.hidden=true;im.removeAttribute('src')}
    const lb=d.querySelector('.lb');lb.textContent=o.label;lb.hidden=!o.label;
    d.classList.toggle('has',!!o.img);
  }else{
    Object.assign(d.style,{left:o.x+'%',top:o.y+'%',fontSize:(o.size/100*P)+'px',color:o.color});
    d.textContent=o.text;d.classList.toggle('bgp',!!o.bg);
  }
}
function placeAll(){
  const P=stage.clientWidth;stage.style.setProperty('--S',P+'px');
  stage.style.setProperty('--g',(S.gap/100*P/2)+'px');
  S.cells.forEach(place);S.texts.forEach(place);overlay();
}
new ResizeObserver(placeAll).observe(stage);
function overlay(){
  const c=cellById(S.act),P=stage.clientWidth,g=S.gap/100*P/2;
  for(const k in els)if(k[0]==='t')els[k].classList.toggle('sel',!!S.sel&&S.sel.k==='t'&&'t'+S.sel.id===k);
  if(!c){vid.hidden=true;ring.hidden=true;hd.hidden=true;return}
  const L=c.x/100*P+g,T=c.y/100*P+g,W=c.w/100*P-2*g,H=c.h/100*P-2*g;
  Object.assign(ring.style,{left:L+'px',top:T+'px',width:W+'px',height:H+'px'});ring.hidden=false;
  Object.assign(vid.style,{left:L+'px',top:T+'px',width:W+'px',height:H+'px'});vid.hidden=!stream;
  const showH=!S.lock&&S.sel&&S.sel.k==='c';
  hd.hidden=!showH;
  if(showH){hd.style.left=(L+W-36)+'px';hd.style.top=(T+H-36)+'px'}
}

/* ---------- touch: tap = choose, drag = move, corner = resize ---------- */
let drag=null;
function snapAxis(v,len,axis,self){
  const E=[0,50,100];
  S.cells.forEach(c=>{if(c!==self){const a=axis==='x'?c.x:c.y,l=axis==='x'?c.w:c.h;E.push(a,a+l)}});
  for(const e of E){if(Math.abs(v-e)<1.5)return e;if(Math.abs(v+len-e)<1.5)return e-len}
  return v;
}
stage.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-k]');
  if(!el){S.sel=null;renderSel();overlay();return}
  const k=el.dataset.k,rs=k==='h',o=rs?cellById(S.act):find(k,+el.dataset.id);
  if(!o)return;
  drag={o,k:k==='t'?'t':'c',rs,sx:e.clientX,sy:e.clientY,s:{...o},moved:false};
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(!drag||S.lock)return;
  const px=e.clientX-drag.sx,py=e.clientY-drag.sy;
  if(!drag.moved&&Math.hypot(px,py)<6)return;
  if(!drag.moved){drag.moved=true;if(!drag.rs)choose(drag.k,drag.o.id,true)}
  const r=stage.getBoundingClientRect(),dx=px/r.width*100,dy=py/r.height*100,s=drag.s,o=drag.o;
  if(drag.k==='t'){o.x=clamp(s.x+dx,0,100);o.y=clamp(s.y+dy,0,100)}
  else if(drag.rs){
    o.w=clamp(snapAxis(s.x+s.w+dx,0,'x',o)-s.x,6,100-s.x);
    o.h=clamp(snapAxis(s.y+s.h+dy,0,'y',o)-s.y,6,100-s.y);
  }else{
    o.x=clamp(snapAxis(s.x+dx,s.w,'x',o),0,100-s.w);
    o.y=clamp(snapAxis(s.y+dy,s.h,'y',o),0,100-s.h);
  }
  if(!raf){raf=requestAnimationFrame(()=>{raf=0;place(o);overlay()})}
});
let raf=0;
function endDrag(){
  if(!drag)return;
  if(drag.moved){place(drag.o);overlay();save()}else if(!drag.rs)choose(drag.k,drag.o.id,false);
  drag=null;
}
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',()=>{drag=null});
function choose(k,id,keep){
  if(k==='c'){
    if(!keep&&S.act===id&&S.sel&&S.sel.k==='c'&&S.sel.id===id){S.act=null;S.sel=null}   // แตะซ้ำ = ปิดกล้อง ดูภาพรวม
    else{S.act=id;S.sel={k:'c',id}}
    if(S.act&&!stream)startCam();
  }else S.sel={k:'t',id};
  renderSel();overlay();status();
}

/* ---------- panel ---------- */
function renderSel(){
  const p=$('#sel'),o=S.sel&&find(S.sel.k,S.sel.id);
  if(!o){p.innerHTML='<p class="hint" style="margin:0">แตะช่องเพื่อเลือกถ่าย · ลากเพื่อย้าย · ลากมุมส้มเพื่อขยาย</p>';return}
  if(S.sel.k==='c'){
    p.innerHTML='<div class="row"><label>ข้อความบนช่อง (เช่น ตำหนิ, ด้านหลัง)<input type="text" id="lb" value="'+esc(o.label)+'"></label></div><div class="row">'+(o.img?'<button class="b" id="clr">ล้างรูปช่องนี้</button>':'')+'<button class="b bad" id="del">ลบช่องนี้</button></div>';
    $('#lb').oninput=e=>{o.label=e.target.value;place(o);save()};
    if(o.img)$('#clr').onclick=()=>{o.img=null;o.url=null;place(o);renderSel()};
    $('#del').onclick=()=>{S.cells=S.cells.filter(c=>c!==o);S.sel=null;if(S.act===o.id)S.act=null;build();save()};
  }else{
    p.innerHTML='<div class="row"><label>ข้อความ<input type="text" id="tx" value="'+esc(o.text)+'"></label></div><div class="row"><label>ขนาด<input type="range" id="sz" min="3" max="16" step="0.5" value="'+o.size+'"></label><input type="color" id="co" value="'+o.color+'"></div><div class="row"><label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="bgc"'+(o.bg?' checked':'')+'>มีพื้นหลังเข้ม</label><button class="b bad" id="del">ลบ</button></div>';
    $('#tx').oninput=e=>{o.text=e.target.value;place(o);save()};
    $('#sz').oninput=e=>{o.size=+e.target.value;place(o);save()};
    $('#co').oninput=e=>{o.color=e.target.value;place(o);save()};
    $('#bgc').onchange=e=>{o.bg=e.target.checked;place(o);save()};
    $('#del').onclick=()=>{S.texts=S.texts.filter(t=>t!==o);S.sel=null;build();save()};
  }
}
$('#chips').innerHTML=PRESETS.map((p,i)=>'<button class="b" data-p="'+i+'">'+p[0]+'</button>').join('')+'<button class="b" id="addCell">+ ช่อง</button><button class="b" id="addTxt">+ ข้อความ (ราคา)</button>';
$('#chips').onclick=e=>{const b=e.target.closest('[data-p]');if(b)applyPreset(+b.dataset.p)};
$('#addCell').onclick=()=>{const c=mk([30,30,40,40]);S.cells.push(c);S.act=c.id;S.sel={k:'c',id:c.id};build();save();startCam()};
$('#addTxt').onclick=()=>{const t={id:uid++,text:'ราคา 199฿',x:50,y:14,size:8,color:'#ffffff',bg:true};S.texts.push(t);S.sel={k:'t',id:t.id};build();save()};
$('#lockBtn').onclick=()=>{S.lock=!S.lock;$('#lockBtn').textContent=S.lock?'ปลดล็อกกรอบ':'ล็อกกรอบ';$('#lockBtn').classList.toggle('on',S.lock);overlay();save()};
$('#gap').oninput=e=>{S.gap=+e.target.value;placeAll();save()};
$('#bg').oninput=e=>{S.bg=e.target.value;stage.style.background=S.bg;save()};
$('#clearAll').onclick=()=>{S.cells.forEach(c=>{c.img=null;c.url=null;place(c)});renderSel()};

/* ---------- camera lives inside the chosen cell ---------- */
let stream=null,facing='environment',starting=false,camId=null,cams=[];
function status(){
  const n=S.cells.filter(c=>c.img).length,t=S.cells.length;
  let m=n+'/'+t+' ช่อง · ';
  if(!S.act)m+='แตะช่องเพื่อถ่าย หรือกดปุ่มกลม';
  else if(stream)m+='ถ่ายช่อง '+(S.cells.indexOf(cellById(S.act))+1)+' สิ่งที่เห็นในกรอบส้มคือรูปที่ได้';
  else m+='ปุ่มกลมจะเปิดกล้องของเครื่อง';
  $('#status').textContent=m;
}
async function startCam(){
  if(stream||starting)return;starting=true;
  try{
    const base={width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}};
    stream=await navigator.mediaDevices.getUserMedia({video:camId?{...base,deviceId:{exact:camId}}:{...base,facingMode:{ideal:facing}},audio:false});
    vid.srcObject=stream;await vid.play();
    await listCams();setupZoom();
  }catch(err){
    stream=null;
    if(camId){camId=null;starting=false;return startCam()}
  }
  starting=false;overlay();status();
}
async function listCams(){
  try{cams=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput')}catch(e){cams=[]}
  const t=stream&&stream.getVideoTracks()[0],st=t&&t.getSettings?t.getSettings():{};
  if(st.deviceId)camId=st.deviceId;
  renderCams();
}
function camName(d,n){
  const l=(d.label||'').toLowerCase();
  if(/front|user|facetime/.test(l))return 'หน้า';
  if(/ultra/.test(l))return 'หลัง มุมกว้างพิเศษ';
  if(/tele/.test(l))return 'หลัง เทเล';
  return 'หลัง '+n;
}
function renderCams(){
  const box=$('#camChips');
  if(cams.length<2){box.hidden=true;return}
  let n=0;
  box.innerHTML=cams.map((d,i)=>{const front=/front|user|facetime/i.test(d.label||'');if(!front)n++;
    return '<button class="b'+(d.deviceId===camId?' on':'')+'" data-i="'+i+'">'+camName(d,n)+'</button>'}).join('');
  box.hidden=false;
}
$('#camChips').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;useCam(cams[+b.dataset.i].deviceId)};
function useCam(id){camId=id;stopCam();startCam()}
function setupZoom(){
  const t=stream&&stream.getVideoTracks()[0],cap=t&&t.getCapabilities?t.getCapabilities():{},z=$('#zoomRow');
  if(cap.zoom&&cap.zoom.max>cap.zoom.min){
    const r=$('#zoom');r.min=cap.zoom.min;r.max=cap.zoom.max;r.step=cap.zoom.step||0.1;
    r.value=(t.getSettings().zoom)||cap.zoom.min;$('#zv').textContent=(+r.value).toFixed(1)+'x';z.hidden=false;
  }else z.hidden=true;
}
$('#zoom').oninput=async e=>{
  const t=stream&&stream.getVideoTracks()[0];if(!t)return;
  try{await t.applyConstraints({advanced:[{zoom:+e.target.value}]});$('#zv').textContent=(+e.target.value).toFixed(1)+'x'}catch(_){}
};
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}vid.srcObject=null;overlay()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCam();else if(S.act)startCam()});
$('#flip').onclick=()=>{
  if(cams.length>1){const i=cams.findIndex(d=>d.deviceId===camId);useCam(cams[(i+1)%cams.length].deviceId)}
  else{facing=facing==='environment'?'user':'environment';camId=null;stopCam();startCam()}
};

$('#shutter').onclick=()=>{
  if(!S.act){const c=S.cells.find(c=>!c.img)||S.cells[0];if(c)choose('c',c.id,true);return}
  if(!stream){$('#fileCam').click();return}
  const c=cellById(S.act),P=stage.clientWidth,g=S.gap/100*P/2;
  const cw=c.w/100*P-2*g,ch=c.h/100*P-2*g,vw=vid.videoWidth,vh=vid.videoHeight;
  const sc=Math.max(cw/vw,ch/vh),sw=cw/sc,sh=ch/sc;
  const o=document.createElement('canvas');o.width=Math.min(1200,Math.round(sw));o.height=Math.round(o.width*ch/cw);
  o.getContext('2d').drawImage(vid,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,o.width,o.height);
  o.toBlob(b=>setImg(b),'image/jpeg',.9);
};
$('#album').onclick=()=>{if(!S.act&&S.cells.length)S.act=(S.cells.find(c=>!c.img)||S.cells[0]).id;$('#fileAlb').click()};
[$('#fileCam'),$('#fileAlb')].forEach(f=>f.onchange=()=>{if(f.files[0])setImg(f.files[0]);f.value=''});
function setImg(blob){
  const c=cellById(S.act);if(!c)return;
  const url=URL.createObjectURL(blob),im=new Image();
  im.onload=()=>{
    c.img=im;c.url=url;place(c);
    const n=S.cells.length;let nx=null;
    for(let k=1;k<=n;k++){const j=S.cells[(S.cells.indexOf(c)+k)%n];if(!j.img){nx=j;break}}
    if(nx){S.act=nx.id;S.sel={k:'c',id:nx.id}}
    else{S.act=null;S.sel=null;toast('ถ่ายครบแล้ว กด “สร้างรูป” ได้เลย')}
    renderSel();overlay();status();
  };
  im.src=url;
}

/* ---------- export ---------- */
function cover(x,im,X,Y,W,H){
  const s=Math.max(W/im.naturalWidth,H/im.naturalHeight),dw=im.naturalWidth*s,dh=im.naturalHeight*s;
  x.drawImage(im,X+(W-dw)/2,Y+(H-dh)/2,dw,dh);
}
function pill(x,tx,cx,cy,fs,padX,padY){
  const w=x.measureText(tx).width+padX*2,h=fs+padY*2;
  x.fillStyle='rgba(0,0,0,.65)';x.beginPath();x.roundRect(cx-w/2,cy-h/2,w,h,h*.3);x.fill();
}
async function exportImg(){
  const N=1080,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');
  try{await document.fonts.load('700 40px "Noto Sans Thai"')}catch(e){}
  x.fillStyle=S.bg;x.fillRect(0,0,N,N);
  const g=S.gap/100*N/2;
  S.cells.forEach(k=>{
    const X=k.x/100*N+g,Y=k.y/100*N+g,W=k.w/100*N-g*2,H=k.h/100*N-g*2;
    x.save();x.beginPath();x.rect(X,Y,W,H);x.clip();
    if(k.img)cover(x,k.img,X,Y,W,H);else{x.fillStyle='#dfe5e8';x.fillRect(X,Y,W,H)}
    x.restore();
    if(k.label){
      const fs=N*.04;x.font='700 '+fs+'px "Noto Sans Thai",sans-serif';x.textAlign='center';x.textBaseline='middle';
      const cy=Y+H-N*.02-(fs+N*.028)/2,cx=X+W/2;
      pill(x,k.label,cx,cy,fs,fs*.7,fs*.35);x.fillStyle='#fff';x.fillText(k.label,cx,cy+fs*.04,W*.92);
    }
  });
  S.texts.forEach(t=>{
    const fs=t.size/100*N;x.font='700 '+fs+'px "Noto Sans Thai",sans-serif';x.textAlign='center';x.textBaseline='middle';
    const cx=t.x/100*N,cy=t.y/100*N;
    if(t.bg)pill(x,t.text,cx,cy,fs,fs*.5,fs*.25);
    x.fillStyle=t.color;x.fillText(t.text,cx,cy+fs*.04);
  });
  return new Promise(r=>c.toBlob(r,'image/jpeg',.92));
}
$('#exportBtn').onclick=async()=>{
  const btn=$('#exportBtn');btn.disabled=true;
  try{
    const blob=await exportImg(),d=new Date(),p=n=>String(n).padStart(2,'0');
    const name='shopee-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+'.jpg';
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    toast('บันทึกรูปแล้ว: '+name);
  }catch(e){toast('บันทึกไม่สำเร็จ ลองอีกครั้ง')}
  btn.disabled=false;
};
$('#closeModal').onclick=()=>{$('#modal').hidden=true};

/* ---------- misc ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
function save(){
  try{localStorage.setItem('shopeeCollage2',JSON.stringify({gap:S.gap,bg:S.bg,lock:S.lock,
    cells:S.cells.map(c=>({x:c.x,y:c.y,w:c.w,h:c.h,label:c.label})),texts:S.texts}))}catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('shopeeCollage2')||'null');
    if(d&&d.cells&&d.cells.length){S.gap=d.gap;S.bg=d.bg;S.lock=!!d.lock;
      S.cells=d.cells.map(c=>{const m=mk([c.x,c.y,c.w,c.h]);m.label=c.label||'';return m});
      S.texts=(d.texts||[]).map(t=>({...t,id:uid++}));return true}
  }catch(e){}
  return false;
}
if(!load())S.cells=PRESETS[0][1].map(r=>mk(r));
S.act=S.cells[0].id;S.sel={k:'c',id:S.act};
$('#gap').value=S.gap;$('#bg').value=S.bg;stage.style.background=S.bg;
$('#lockBtn').textContent=S.lock?'ปลดล็อกกรอบ':'ล็อกกรอบ';$('#lockBtn').classList.toggle('on',S.lock);
build();status();startCam();
</script>
