<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A75"><meta name="apple-mobile-web-app-capable" content="yes">
<title>ถ่ายรูปลง Shopee 1:1</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Kanit:wght@400;700&family=Prompt:wght@400;700&family=Mitr:wght@400;500&family=Sriracha&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F3;--panel:#fff;--ink:#16222B;--mute:#5d6b75;--line:#d5dce1;--acc:#0B7A75;--accInk:#fff;--hi:#FF5722;--bad:#b42318;--ph:#dfe5e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181D;--panel:#1B242B;--ink:#EAF0F3;--mute:#93a2ad;--line:#2d3a43;--acc:#2BB3AB;--accInk:#04201f;--hi:#ff7a4d;--bad:#ff8a7a;--ph:#26323a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181D;--panel:#1B242B;--ink:#EAF0F3;--mute:#93a2ad;--line:#2d3a43;--acc:#2BB3AB;--accInk:#04201f;--hi:#ff7a4d;--bad:#ff8a7a;--ph:#26323a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 13px/1.4 "Noto Sans Thai",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 84px}
.fix{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding:8px 0 6px;box-shadow:0 1px 0 var(--line)}
.srow{display:flex;gap:6px;align-items:center;margin-top:6px}
#status{flex:1;min-width:0;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:17px;margin:0;font-weight:700}
.sw{width:min(100%,52vh);margin:0 auto}
@supports (height:1dvh){.sw{width:min(100%,52dvh)}}
#stage{position:relative;width:100%;aspect-ratio:1/1;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.layer{position:absolute;inset:0;pointer-events:none}
#cl{z-index:0}#tl{z-index:3}
.cell,.txt{pointer-events:auto}
.cell{position:absolute}
.cell .in{position:absolute;inset:var(--g,0px);background:var(--ph);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cell .no{font-size:calc(var(--S)*.05);font-weight:700;pointer-events:none}
.cell:not(.has) .in{outline:2px dashed var(--acc);outline-offset:-6px;color:var(--acc)}
.cell .lb{position:absolute;bottom:calc(var(--S)*.02);left:50%;transform:translateX(-50%);max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(0,0,0,.65);color:#fff;font-weight:700;font-size:calc(var(--S)*.04);line-height:1;padding:calc(var(--S)*.014) calc(var(--S)*.028);border-radius:999px;pointer-events:none}
#vid{position:absolute;z-index:1;object-fit:cover;pointer-events:none;background:#000}
#vid[hidden],#ring[hidden],#hd[hidden]{display:none}
#ring{position:absolute;z-index:2;border:3px solid var(--hi);pointer-events:none}
#ring.grid{--gl:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.75));background:var(--gl) 33.333% 0/1px 100% no-repeat,var(--gl) 66.666% 0/1px 100% no-repeat,var(--gl) 0 33.333%/100% 1px no-repeat,var(--gl) 0 66.666%/100% 1px no-repeat}
#hd{position:absolute;z-index:4;width:36px;height:36px;background:var(--hi);border-radius:10px 0 0 0;touch-action:none}
#hd::after{content:"";position:absolute;right:8px;bottom:8px;width:12px;height:12px;border-right:3px solid #fff;border-bottom:3px solid #fff}
.txt{position:absolute;white-space:pre;text-align:center;line-height:1.2}
textarea,select{font:400 16px "Noto Sans Thai",sans-serif;padding:5px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.frow{display:flex;gap:8px;align-items:center}.frow+.frow{margin-top:8px}.frow .fl{flex:0 0 48px;font-weight:700;font-size:12.5px}.frow input{flex:1;min-width:0}.frow select{flex:1;width:auto;min-width:0}
.pgrid{display:grid;grid-template-columns:repeat(3,28px);gap:3px}.pos{width:28px;height:28px;padding:0}
.txt.bgp{background:rgba(0,0,0,.65);padding:.25em .5em;border-radius:.35em}
.txt.sel{outline:3px solid var(--hi);outline-offset:3px}
#qe{display:flex;gap:6px;align-items:flex-end;margin-top:6px}#qe label{min-width:0}#qe input,#qe textarea{width:100%;min-width:0}#qe .b{flex:0 0 auto}
#camSum{font-weight:400;color:var(--mute);font-size:11.5px;margin-left:6px}
.hint{color:var(--mute);font-size:11.5px;margin:4px 0 0;text-align:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .b{flex:0 0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.card h2{font-size:12.5px;margin:0 0 6px;font-weight:700}
summary{font-weight:600;font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row+.row{margin-top:6px}
.b{font:600 12.5px "Noto Sans Thai",sans-serif;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 10px;border-radius:8px}
.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.bad{color:var(--bad)}
.on{background:var(--ink);color:var(--bg)}
label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--mute);flex:1;min-width:100px}
input[type=text]{font:400 16px "Noto Sans Thai",sans-serif;padding:5px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
input[type=range]{width:100%}
.bar{position:fixed;left:0;right:0;bottom:0;padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
.bar>div{max-width:528px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.bar .l{justify-self:start}.bar .r{justify-self:end}
#shutter{width:54px;height:54px;border-radius:50%;border:4px solid var(--acc);background:var(--panel);box-shadow:inset 0 0 0 4px var(--acc)}
#shutter:active{transform:scale(.94)}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#16222B;color:#fff;padding:9px 14px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="fix"><div class="sw"><div id="stage">
    <div id="cl" class="layer"></div>
    <video id="vid" playsinline muted hidden></video>
    <div id="ring" hidden></div>
    <div id="tl" class="layer"></div>
    <div id="hd" data-k="h" hidden></div>
  </div></div>
  <div class="srow"><span id="status">กำลังเปิดกล้อง…</span><button class="b" id="album">อัลบั้ม</button><button class="b" id="lockBtn">ล็อกกรอบ</button><button class="b bad" id="clearAll">ล้างรูปทั้งหมด</button></div><div id="qe" hidden></div></div>
<details class="card" id="camTools"><summary>เครื่องมือกล้อง <span id="camSum"></span></summary>
  <div class="row" style="margin-top:8px"><button class="b" id="gridBtn">เส้นกริด</button><button class="b" id="torchBtn" hidden>แฟลช</button></div>
  <div class="chips" id="camChips" hidden></div>
  <div class="row" id="zoomRow" hidden><label>ซูม <b id="zv"></b><input type="range" id="zoom"></label></div>
  <p class="hint" id="camInfo"></p>
</details>
  <div class="chips" id="chips"></div>
  <div class="card"><h2>ข้อมูลสินค้า (ขึ้นบนรูป)</h2><div id="fl"></div></div>
  <div class="card" id="sel"></div>
  <details class="card"><summary>ตั้งค่าเพิ่มเติม</summary>
    <div class="row" style="margin-top:10px"><label>ระยะห่างระหว่างช่อง<input type="range" id="gap" min="0" max="6" step="0.2"></label>
    <label style="flex:0 0 auto;min-width:0">สีพื้น<input type="color" id="bg"></label></div>
    <div class="row" style="margin-top:10px"><label>โปรไฟล์ร้าน (เลย์เอาต์ + ข้อความ + สไตล์)<select id="prof"></select></label></div>
    <div class="row"><button class="b" id="profLoad">ใช้โปรไฟล์</button><button class="b" id="profSave">บันทึกเป็นโปรไฟล์</button><button class="b bad" id="profDel">ลบ</button></div>
    
  </details>
</div>

<div class="bar"><div>
  <button class="b l" id="flip">สลับกล้อง</button>
  <button id="shutter" aria-label="ถ่ายรูป"></button>
  <button class="b pri r" id="exportBtn">สร้างรูป</button>
</div></div>

<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileAlb" accept="image/*" hidden>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),stage=$('#stage'),cl=$('#cl'),tl=$('#tl'),vid=$('#vid'),ring=$('#ring'),hd=$('#hd');
const qe=$('#qe');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let uid=1;
const S={gap:1.2,bg:'#ffffff',lock:false,cells:[],texts:[],sel:null,act:null};
const PRESETS=[
 ['ใหญ่ซ้าย + 3 ขวา',[[0,0,60,100],[60,0,40,33.34],[60,33.34,40,33.33],[60,66.67,40,33.33]]],
 ['ใหญ่ซ้าย + 2 ขวา',[[0,0,60,100],[60,0,40,50],[60,50,40,50]]],
 ['ใหญ่บน + 3 ล่าง',[[0,0,100,60],[0,60,33.34,40],[33.34,60,33.33,40],[66.67,60,33.33,40]]],
 ['2×2',[[0,0,50,50],[50,0,50,50],[0,50,50,50],[50,50,50,50]]],
 ['1 ช่องเต็ม',[[0,0,100,100]]]
];
const FONTS=[['Noto Sans Thai',700,'มาตรฐาน'],['Kanit',700,'หนา เด่น'],['Prompt',700,'โมเดิร์น'],['Mitr',500,'กลม น่ารัก'],['Sriracha',400,'ลายมือ']];
const TXT_DEF={text:'ราคา 199฿',x:50,y:5,ax:.5,ay:0,size:8,color:'#ffffff',font:0,bg:true,bgc:'#e8431a',bga:.9,stroke:false};
function rgba(h,a){const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'}
function contrast(h){const n=parseInt(h.slice(1),16),l=.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255);return l>140?'#000000':'#ffffff'}
const FIELDS=[['chest','อก','อก '],['length','ยาว','ยาว '],['code','รหัส','']];
const POSN=['ซ้ายบน','กลางบน','ขวาบน','ซ้ายกลาง','กลาง','ขวากลาง','ซ้ายล่าง','กลางล่าง','ขวาล่าง'];
const lineList=o=>FIELDS.map(f=>(o[f[0]]||'').trim()?f[2]+o[f[0]].trim():'').filter(Boolean);
const txtOf=o=>o.group?lineList(o).join('\n'):o.text;
const grp=()=>S.texts.find(t=>t.group);
const GRP_NEW=()=>({group:true,chest:'',length:'',code:'',size:7,x:4,y:5,ax:0,ay:0,bgc:'#16222B'});
function setPos(o,i){const c=i%3,w=Math.floor(i/3);o.ax=c/2;o.ay=w/2;o.x=[4,50,96][c];o.y=[5,50,95][w]}
function ensureFields(){if(!grp())S.texts.push(normText(GRP_NEW()))}
function renderFields(){
  const o=grp(),pi=Math.round(o.ay*2)*3+Math.round(o.ax*2);
  $('#fl').innerHTML=FIELDS.map(f=>'<div class="frow"><span class="fl">'+f[1]+'</span><input type="text" data-f="'+f[0]+'" value="'+esc(o[f[0]]||'')+'" placeholder="'+(f[0]==='code'?'เช่น A12':'เช่น 38')+'"></div>').join('')+
    '<div class="frow"><span class="fl">ตำแหน่ง</span><select data-p="1">'+POSN.map((n,i)=>'<option value="'+i+'"'+(i===pi?' selected':'')+'>'+n+'</option>').join('')+'</select></div>';
}
$('#fl').addEventListener('input',e=>{const k=e.target.dataset.f;if(!k)return;const o=grp();o[k]=e.target.value;place(o);
  const q=qe.querySelector('[data-q="'+k+'"]');if(q&&q!==document.activeElement)q.value=o[k];save()});
$('#fl').addEventListener('change',e=>{if(!e.target.dataset.p)return;const o=grp();setPos(o,+e.target.value);place(o);save();if(S.sel&&S.sel.id===o.id)renderSel()});
function normText(t){const lg=t.ax===undefined;return {...TXT_DEF,...t,ax:lg?.5:t.ax,ay:lg?.5:t.ay,id:uid++}}
const mk=(r,old)=>({id:uid++,x:r[0],y:r[1],w:r[2],h:r[3],label:old?old.label:'',url:old?old.url:null,img:old?old.img:null,blob:old?old.blob:null});
const cellById=id=>S.cells.find(c=>c.id===id);
const find=(k,id)=>(k==='c'?S.cells:S.texts).find(o=>o.id===id);
function applyPreset(i){S.cells=PRESETS[i][1].map((r,k)=>mk(r,S.cells[k]));S.act=S.cells[0].id;S.sel={k:'c',id:S.act};build();save();saveImgs()}

/* ---------- stage ---------- */
const els={};
function build(){
  cl.innerHTML='';tl.innerHTML='';
  for(const k in els)delete els[k];
  S.cells.forEach(c=>{
    const d=document.createElement('div');d.className='cell';d.dataset.k='c';d.dataset.id=c.id;
    d.innerHTML='<div class="in"><span class="no"></span><img hidden alt=""><span class="lb" hidden></span></div>';
    cl.appendChild(d);els['c'+c.id]=d;
  });
  S.texts.forEach(t=>{
    const d=document.createElement('div');d.className='txt';d.dataset.k='t';d.dataset.id=t.id;
    tl.appendChild(d);els['t'+t.id]=d;
  });
  if(!cellById(S.act))S.act=null;
  placeAll();renderSel();
}
function place(o){
  const isC=o.w!==undefined,d=els[(isC?'c':'t')+o.id];if(!d)return;
  const P=stage.clientWidth;
  if(isC){
    Object.assign(d.style,{left:o.x+'%',top:o.y+'%',width:o.w+'%',height:o.h+'%'});
    d.querySelector('.no').textContent=o.img?'':(S.cells.indexOf(o)+1);
    const im=d.querySelector('img');if(o.url){if(im.getAttribute('src')!==o.url)im.src=o.url;im.hidden=false}else{im.hidden=true;im.removeAttribute('src')}
    const lb=d.querySelector('.lb');lb.textContent=o.label;lb.hidden=!o.label;
    d.classList.toggle('has',!!o.img);
  }else{
    const F=FONTS[o.font]||FONTS[0],fs=o.size/100*P;
    Object.assign(d.style,{left:o.x+'%',top:o.y+'%',fontSize:fs+'px',color:o.color,fontFamily:'"'+F[0]+'",sans-serif',fontWeight:F[1],
      transform:'translate('+(-o.ax*100)+'%,'+(-o.ay*100)+'%)',background:o.bg?rgba(o.bgc,o.bga):'none',
      padding:o.bg?'.25em .5em':'0',borderRadius:o.bg?'.35em':'0',webkitTextStroke:o.stroke?(fs*.14)+'px '+contrast(o.color):'0'});
    d.style.paintOrder='stroke fill';const tx=txtOf(o);d.textContent=tx;d.style.display=(o.group&&!tx)?'none':'';d.style.textAlign=o.group?(o.ax===0?'left':o.ax===1?'right':'center'):'center';
  }
}
function placeAll(){
  const P=stage.clientWidth;stage.style.setProperty('--S',P+'px');
  stage.style.setProperty('--g',(S.gap/100*P/2)+'px');
  S.cells.forEach(place);S.texts.forEach(place);overlay();
}
new ResizeObserver(placeAll).observe(stage);
function overlay(){
  const c=cellById(S.act),P=stage.clientWidth,g=S.gap/100*P/2;
  for(const k in els)if(k[0]==='t')els[k].classList.toggle('sel',!!S.sel&&S.sel.k==='t'&&'t'+S.sel.id===k);
  if(!c){vid.hidden=true;ring.hidden=true;hd.hidden=true;return}
  const L=c.x/100*P+g,T=c.y/100*P+g,W=c.w/100*P-2*g,H=c.h/100*P-2*g;
  Object.assign(ring.style,{left:L+'px',top:T+'px',width:W+'px',height:H+'px'});ring.hidden=false;ring.classList.toggle('grid',gridOn&&!!stream);
  Object.assign(vid.style,{left:L+'px',top:T+'px',width:W+'px',height:H+'px'});vid.hidden=!stream;
  const showH=!S.lock&&S.sel&&S.sel.k==='c';
  hd.hidden=!showH;
  if(showH){hd.style.left=(L+W-36)+'px';hd.style.top=(T+H-36)+'px'}
}

/* ---------- touch: tap = choose, drag = move, corner = resize ---------- */
let drag=null;
function snapAxis(v,len,axis,self){
  const E=[0,50,100];
  S.cells.forEach(c=>{if(c!==self){const a=axis==='x'?c.x:c.y,l=axis==='x'?c.w:c.h;E.push(a,a+l)}});
  for(const e of E){if(Math.abs(v-e)<1.5)return e;if(Math.abs(v+len-e)<1.5)return e-len}
  return v;
}
stage.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-k]');
  if(!el){S.sel=null;renderSel();overlay();return}
  const k=el.dataset.k,rs=k==='h',o=rs?cellById(S.act):find(k,+el.dataset.id);
  if(!o)return;
  drag={o,k:k==='t'?'t':'c',rs,sx:e.clientX,sy:e.clientY,s:{...o},moved:false};
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(!drag||S.lock)return;
  const px=e.clientX-drag.sx,py=e.clientY-drag.sy;
  if(!drag.moved&&Math.hypot(px,py)<6)return;
  if(!drag.moved){drag.moved=true;if(!drag.rs)choose(drag.k,drag.o.id,true)}
  const r=stage.getBoundingClientRect(),dx=px/r.width*100,dy=py/r.height*100,s=drag.s,o=drag.o;
  if(drag.k==='t'){o.x=clamp(s.x+dx,0,100);o.y=clamp(s.y+dy,0,100)}
  else if(drag.rs){
    o.w=clamp(snapAxis(s.x+s.w+dx,0,'x',o)-s.x,6,100-s.x);
    o.h=clamp(snapAxis(s.y+s.h+dy,0,'y',o)-s.y,6,100-s.y);
  }else{
    o.x=clamp(snapAxis(s.x+dx,s.w,'x',o),0,100-s.w);
    o.y=clamp(snapAxis(s.y+dy,s.h,'y',o),0,100-s.h);
  }
  if(!raf){raf=requestAnimationFrame(()=>{raf=0;place(o);overlay()})}
});
let raf=0;
function endDrag(){
  if(!drag)return;
  if(drag.moved){place(drag.o);overlay();save()}else if(!drag.rs)choose(drag.k,drag.o.id,false);
  drag=null;
}
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',()=>{drag=null});
function choose(k,id,keep){
  if(k==='c'){
    if(!keep&&S.act===id&&S.sel&&S.sel.k==='c'&&S.sel.id===id){S.act=null;S.sel=null}   // แตะซ้ำ = ปิดกล้อง ดูภาพรวม
    else{S.act=id;S.sel={k:'c',id}}
    if(S.act&&!stream)startCam();
  }else{S.sel={k:'t',id};if(!keep)openQE(find('t',id))}
  renderSel();overlay();status();
}
/* ---------- quick edit on screen ---------- */
function openQE(o){
  if(!o)return;
  qe.hidden=false;qe.dataset.id=o.id;
  qe.innerHTML=(o.group?FIELDS.map(f=>'<label>'+f[1]+'<input type="text" data-q="'+f[0]+'" value="'+esc(o[f[0]]||'')+'"></label>').join(''):'<label>ข้อความบนรูป<textarea data-q="text" rows="2">'+esc(o.text)+'</textarea></label>')+'<button class="b pri" data-done>เสร็จ</button>';
  const f=qe.querySelector('input,textarea');setTimeout(()=>{f.focus();if(f.select)f.select()},0);
}
function closeQE(){if(qe.contains(document.activeElement))document.activeElement.blur();qe.hidden=true;qe.innerHTML='';qe.dataset.id=''}
qe.addEventListener('input',e=>{

/* ---------- camera lives inside the chosen cell ---------- */
let stream=null,facing='environment',starting=false,camId=null,cams=[];
let gridOn=false,torchOn=false;try{gridOn=localStorage.getItem('shopeeGrid')==='1'}catch(e){}
function status(){
  const n=S.cells.filter(c=>c.img).length,t=S.cells.length;
  let m=n+'/'+t+' ช่อง · ';
  if(!S.act)m+='แตะช่องเพื่อถ่าย';
  else if(stream)m+='กำลังถ่ายช่อง '+(S.cells.indexOf(cellById(S.act))+1);
  else m+='ใช้กล้องของเครื่อง';
  $('#status').textContent=m;
}
async function startCam(){
  if(stream||starting)return;starting=true;
  try{
    const base={width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}};
    stream=await navigator.mediaDevices.getUserMedia({video:camId?{...base,deviceId:{exact:camId}}:{...base,facingMode:{ideal:facing}},audio:false});
    vid.srcObject=stream;await vid.play();
    await listCams();setupZoom();setupTorch();
  }catch(err){
    stream=null;
    $('#camInfo').textContent='เปิดกล้องในแอปไม่สำเร็จ'+(err&&err.name?' ('+err.name+')':'')+' · ตรวจว่าอนุญาตกล้องให้เว็บนี้แล้ว';
    if(camId){camId=null;starting=false;return startCam()}
  }
  starting=false;overlay();status();
}
async function listCams(){
  const t=stream&&stream.getVideoTracks()[0],st=t&&t.getSettings?t.getSettings():{};
  if(st.deviceId)camId=st.deviceId;
  try{
    const rear=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'&&d.deviceId&&!/front|user|facetime|selfie|depth|infrared|\bir\b|tof|desk/i.test(d.label||''));
    let real=rear.filter(d=>!/dual|triple|quad/i.test(d.label||''));if(!real.length)real=rear;
    const seen=new Set();real=real.filter(d=>!seen.has(d.deviceId)&&seen.add(d.deviceId));
    cams=real.slice(0,3);
    const cur=real.find(d=>d.deviceId===camId);if(cur&&!cams.includes(cur))cams[2]=cur;
  }catch(e){cams=[]}
  renderCams();
}
function camName(d,n){
  const l=(d.label||'').toLowerCase();
  if(/ultra/.test(l))return 'มุมกว้างพิเศษ';
  if(/tele/.test(l))return 'เทเล';
  if(/^back camera$|main|\bwide\b/.test(l))return 'กล้องหลัก';
  return 'กล้องหลัง '+n;
}
function renderCams(){
  const box=$('#camChips');
  $('#camInfo').textContent='กล้องหลัง '+cams.length+' ตัว'+(cams.length?': '+cams.map(d=>d.label||'ไม่มีชื่อ').join(' | '):'')+(cams.length<3?' · ถ้าไม่ครบ ลองแถบซูม หรือเปิดด้วย Chrome':'');
  camSum();
  if(cams.length<2){box.hidden=true;return}
  box.innerHTML=cams.map((d,i)=>'<button class="b'+(d.deviceId===camId?' on':'')+'" data-i="'+i+'">'+camName(d,i+1)+'</button>').join('');
  box.hidden=false;
}
if(navigator.mediaDevices&&navigator.mediaDevices.addEventListener)navigator.mediaDevices.addEventListener('devicechange',()=>{if(stream)listCams()});
$('#camChips').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;useCam(cams[+b.dataset.i].deviceId)};
function useCam(id){camId=id;stopCam();startCam()}
function camSum(){

  $('#camSum').textContent=stream?'· '+(i>=0?camName(cams[i],i+1):'กล้องหลัง')+z:'';

function setupZoom(){

$('#shutter').onclick=()=>{
  if(!S.act){const c=S.cells.find(c=>!c.img)||S.cells[0];if(c)choose('c',c.id,true);return}
  if(!stream){$('#fileCam').click();return}
  const c=cellById(S.act),P=stage.clientWidth,g=S.gap/100*P/2;
  const cw=c.w/100*P-2*g,ch=c.h/100*P-2*g,vw=vid.videoWidth,vh=vid.videoHeight;
  const sc=Math.max(cw/vw,ch/vh),sw=cw/sc,sh=ch/sc;
  const o=document.createElement('canvas');o.width=Math.min(1200,Math.round(sw));o.height=Math.round(o.width*ch/cw);
  o.getContext('2d').drawImage(vid,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,o.width,o.height);

$('#album').onclick=()=>{if(!S.act&&S.cells.length)S.act=(S.cells.find(c=>!c.img)||S.cells[0]).id;$('#fileAlb').click()};
[$('#fileCam'),$('#fileAlb')].forEach(f=>f.onchange=()=>{if(f.files[0])setImg(f.files[0]);f.value=''});
function setImg(blob){
  const c=cellById(S.act);if(!c)return;
  const url=URL.createObjectURL(blob),im=new Image();
  im.onload=()=>{
    const had=!!c.img;if(c.url&&c.url!==url)URL.revokeObjectURL(c.url);
    c.img=im;c.url=url;c.blob=blob;place(c);saveImgs();
    const n=S.cells.length;let nx=null;
    for(let k=1;k<=n;k++){const j=S.cells[(S.cells.indexOf(c)+k)%n];if(!j.img){nx=j;break}}
    if(nx){S.act=nx.id;S.sel={k:'c',id:nx.id};if(had)toast('ถ่ายทับช่อง '+(S.cells.indexOf(c)+1)+' แล้ว')}
    else{S.act=null;S.sel=null;toast('ถ่ายครบแล้ว กด “สร้างรูป” ได้เลย')}
    renderSel();overlay();status();
  };
  im.src=url;
}

/* ---------- export ---------- */
function cover(x,im,X,Y,W,H){
  const s=Math.max(W/im.naturalWidth,H/im.naturalHeight),dw=im.naturalWidth*s,dh=im.naturalHeight*s;
  x.drawImage(im,X+(W-dw)/2,Y+(H-dh)/2,dw,dh);
}
function pill(x,tx,cx,cy,fs,padX,padY){
  const w=x.measureText(tx).width+padX*2,h=fs+padY*2;
  x.fillStyle='rgba(0,0,0,.65)';x.beginPath();x.roundRect(cx-w/2,cy-h/2,w,h,h*.3);x.fill();
}
async function exportImg(){
  const N=1080,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');
  try{await Promise.all(FONTS.map(f=>document.fonts.load(f[1]+' 40px "'+f[0]+'"')))}catch(e){}
  x.fillStyle=S.bg;x.fillRect(0,0,N,N);
  const g=S.gap/100*N/2;
  S.cells.forEach(k=>{
    const X=k.x/100*N+g,Y=k.y/100*N+g,W=k.w/100*N-g*2,H=k.h/100*N-g*2;
    x.save();x.beginPath();x.rect(X,Y,W,H);x.clip();
    if(k.img)cover(x,k.img,X,Y,W,H);else{x.fillStyle='#dfe5e8';x.fillRect(X,Y,W,H)}
    x.restore();
    if(k.label){
      const fs=N*.04;x.font='700 '+fs+'px "Noto Sans Thai",sans-serif';x.textAlign='center';x.textBaseline='middle';
      const cy=Y+H-N*.02-(fs+N*.028)/2,cx=X+W/2;
      pill(x,k.label,cx,cy,fs,fs*.7,fs*.35);x.fillStyle='#fff';x.fillText(k.label,cx,cy+fs*.04,W*.92);
    }
  });
  S.texts.forEach(t=>{
    const tx=txtOf(t);if(t.group&&!tx)return;
    const F=FONTS[t.font]||FONTS[0],fs=t.size/100*N,lh=fs*1.2,lines=String(tx).split('\n');
    x.font=F[1]+' '+fs+'px "'+F[0]+'",sans-serif';const al=t.group?t.ax:.5;x.textAlign=al===0?'left':al===1?'right':'center';x.textBaseline='middle';
    const mw=Math.max(0,...lines.map(l=>x.measureText(l).width)),px=t.bg?fs*.5:0,py=t.bg?fs*.25:0;
    const bw=mw+px*2,bh=lines.length*lh+py*2,L=t.x/100*N-t.ax*bw,T=t.y/100*N-t.ay*bh;
    if(t.bg){x.fillStyle=rgba(t.bgc,t.bga);x.beginPath();x.roundRect(L,T,bw,bh,fs*.35);x.fill()}
    lines.forEach((l,i)=>{
      const cy=T+py+(i+.5)*lh+fs*.04,cx=al===0?L+px:al===1?L+bw-px:L+bw/2;
      if(t.stroke){x.lineJoin='round';x.lineWidth=fs*.14;x.strokeStyle=contrast(t.color);x.strokeText(l,cx,cy)}
      x.fillStyle=t.color;x.fillText(l,cx,cy);
    });
  });
  return new Promise(r=>c.toBlob(r,'image/jpeg',.92));
}
$('#exportBtn').onclick=async()=>{
  const btn=$('#exportBtn');btn.disabled=true;
  try{
    const blob=await exportImg(),d=new Date(),p=n=>String(n).padStart(2,'0');
    const cd=((grp()||{}).code||'').trim().replace(/[^\w\u0E00-\u0E7F-]+/g,'_').slice(0,40),name=cd?cd+'.jpg':'shopee-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+'.jpg';

    setTimeout(()=>URL.revokeObjectURL(url),10000);
    toast('บันทึกรูปแล้ว: '+name);
  }catch(e){toast('บันทึกไม่สำเร็จ ลองอีกครั้ง')}
  btn.disabled=false;
};

/* ---------- keep photos across refresh (IndexedDB) ---------- */
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('shopeePhotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function idbSet(k,v){try{const db=await idb();await new Promise((ok,no)=>{const t=db.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)});db.close()}catch(e){}}
async function idbGet(k){try{const db=await idb();const v=await new Promise((ok,no)=>{const r=db.transaction('k').objectStore('k').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});db.close();return v}catch(e){return null}}
let imgT=0;
function saveImgs(){clearTimeout(imgT);imgT=setTimeout(()=>idbSet('imgs',S.cells.map(c=>c.blob||null)),150)}
async function restoreImgs(){
  const a=await idbGet('imgs');if(!Array.isArray(a))return;
  let n=0;
  await Promise.all(S.cells.map((c,i)=>{const b=a[i];if(!b||c.img)return;return new Promise(ok=>{
    const url=URL.createObjectURL(b),im=new Image();
    im.onload=()=>{if(!c.img){c.img=im;c.url=url;c.blob=b;n++;place(c)}ok()};
    im.onerror=()=>{URL.revokeObjectURL(url);ok()};im.src=url})}));
  if(n){const e=S.cells.find(c=>!c.img);S.act=e?e.id:null;S.sel=e?{k:'c',id:e.id}:null;renderSel();overlay();status();toast('กู้รูปที่ถ่ายไว้คืนแล้ว '+n+' รูป')}
}

$('#profLoad').onclick=()=>{
  const n=$('#prof').value,d=n&&profs()[n];if(!d||!d.cells||!d.cells.length){toast('เลือกโปรไฟล์ก่อน');return}
  const g=grp(),keep=g?{chest:g.chest,length:g.length,code:g.code}:{};
  S.gap=Number.isFinite(+d.gap)?clamp(+d.gap,0,6):1.2;S.bg=/^#[0-9a-f]{6}$/i.test(d.bg)?d.bg:'#ffffff';
  S.cells=d.cells.map((c,k)=>{const m=mk([c.x,c.y,c.w,c.h],S.cells[k]);m.label=c.label||'';return m});
  S.texts=(d.texts||[]).filter(t=>!t.field).map(normText);ensureFields();Object.assign(grp(),keep);
  $('#gap').value=S.gap;$('#bg').value=S.bg;stage.style.background=S.bg;
  const a=S.cells.find(c=>!c.img)||S.cells[0];S.act=a?a.id:null;S.sel=a?{k:'c',id:a.id}:null;
  renderFields();build();save();saveImgs();toast('ใช้โปรไฟล์ “'+n+'” แล้ว');if(S.act&&!stream)startCam();
};
$('#profDel').onclick=()=>{const n=$('#prof').value;if(!n)return;if(!confirm('ลบโปรไฟล์ “'+n+'” ใช่ไหม?'))return;const o=profs();delete o[n];if(profWrite(o))renderProfs('')};
renderProfs('');

/* ---------- misc ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
function save(){
  try{localStorage.setItem('shopeeCollage2',JSON.stringify({gap:S.gap,bg:S.bg,lock:S.lock,
    cells:S.cells.map(c=>({x:c.x,y:c.y,w:c.w,h:c.h,label:c.label})),texts:S.texts}))}catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('shopeeCollage2')||'null');
    if(d&&d.cells&&d.cells.length){S.gap=Number.isFinite(+d.gap)?clamp(+d.gap,0,6):1.2;S.bg=/^#[0-9a-f]{6}$/i.test(d.bg)?d.bg:'#ffffff';S.lock=!!d.lock;
      S.cells=d.cells.map(c=>{const m=mk([c.x,c.y,c.w,c.h]);m.label=c.label||'';return m});
      const tx=d.texts||[],old=tx.filter(t=>t.field);
      S.texts=tx.filter(t=>!t.field).map(normText);
      if(!S.texts.some(t=>t.group)&&old.length){const g=normText(GRP_NEW());old.forEach(t=>{g[t.field]=t.val||''});S.texts.push(g)}
      return true}
  }catch(e){}
  return false;
}
if(!load())S.cells=PRESETS[0][1].map(r=>mk(r));
ensureFields();
S.act=S.cells[0].id;S.sel={k:'c',id:S.act};
$('#gap').value=S.gap;$('#bg').value=S.bg;stage.style.background=S.bg;
$('#lockBtn').textContent=S.lock?'ปลดล็อกกรอบ':'ล็อกกรอบ';$('#lockBtn').classList.toggle('on',S.lock);
const ct=$('#camTools');
try{ct.open=localStorage.getItem('shopeeCamTools')==='1'}catch(e){}
ct.addEventListener('toggle',()=>{try{localStorage.setItem('shopeeCamTools',ct.open?'1':'0')}catch(e){}});
renderFields();build();status();startCam();restoreImgs();
</script>
</body>
</html>
